<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<title>Vokabeltrainer</title>

<style>
body{
  font-family:system-ui;
  background:#f5f7fb;
  padding:16px;
}

.card{
  background:white;
  padding:16px;
  border-radius:12px;
  margin-bottom:16px;
}

button{
  padding:10px;
  border:none;
  border-radius:8px;
  background:#2563eb;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.hidden{display:none;}
</style>
</head>

<body>

<div class="card">
<h3>Einstellungen</h3>

<label>Kategorie</label>
<select id="category"></select>

<div>
<input type="checkbox" id="chk1" checked> 1
<input type="checkbox" id="chk2" checked> 2
<input type="checkbox" id="chk3" checked> 3
</div>

<button id="nextBtn">Weiter</button>
<button id="exportBtn">CSV Export</button>
</div>

<div class="card">
<div id="question">Bitte importieren</div>

<div id="solutionArea" class="hidden">
<div id="answer"></div>

<button id="editBtn">Bearbeiten</button>

<div id="editArea" class="hidden">
<input id="editDeutsch">
<input id="editSpanisch">
<textarea id="editBemerkungen"></textarea>
</div>

<button id="easierBtn">-</button>
<button id="harderBtn">+</button>
</div>
</div>

<div class="card">
<input type="file" id="importFile">
</div>

<script>

const STORAGE_KEY="trainer_v9";

let words=[];
let current=null;
let showingSolution=false;

const el={
chk1:chk1,
chk2:chk2,
chk3:chk3,
category:category,
nextBtn:nextBtn,
exportBtn:exportBtn,
importFile:importFile,
question:question,
answer:answer,
solutionArea:solutionArea,
editBtn:editBtn,
editArea:editArea,
editDeutsch:editDeutsch,
editSpanisch:editSpanisch,
editBemerkungen:editBemerkungen,
easierBtn:easierBtn,
harderBtn:harderBtn
};

function ensureAtLeastOneLevel(clicked){
  if(!el.chk1.checked && !el.chk2.checked && !el.chk3.checked){
    clicked.checked=true;
  }
}

[el.chk1,el.chk2,el.chk3].forEach(c=>{
  c.addEventListener("change",()=>ensureAtLeastOneLevel(c));
});

function getFiltered(){
  return words.filter(w=>{
    if(el.category.value && w.Kategorie!=el.category.value) return false;

    if(w.Zaehler==1 && !el.chk1.checked) return false;
    if(w.Zaehler==2 && !el.chk2.checked) return false;
    if(w.Zaehler==3 && !el.chk3.checked) return false;

    return true;
  });
}

function weight(z){
  if(z==1) return 1;
  if(z==2) return 2;
  if(z==3) return 4;
}

function nextWord(){
  let list=getFiltered();

  if(!list.length){
    el.question.textContent="Keine Wörter";
    return;
  }

  let total=list.reduce((s,w)=>s+weight(w.Zaehler),0);
  let r=Math.random()*total;

  let acc=0;
  for(let w of list){
    acc+=weight(w.Zaehler);
    if(r<=acc){
      current=w;
      break;
    }
  }

  el.question.textContent=current.Deutsch;
  el.solutionArea.classList.add("hidden");
  showingSolution=false;
}

function showSolution(){
  el.answer.textContent=current.Spanisch;
  el.solutionArea.classList.remove("hidden");
  showingSolution=true;
}

el.nextBtn.onclick=()=>{
  if(!current || showingSolution) nextWord();
  else showSolution();
};

el.easierBtn.onclick=()=>{ if(current){current.Zaehler=Math.max(1,current.Zaehler-1);save();}};
el.harderBtn.onclick=()=>{ if(current){current.Zaehler=Math.min(3,current.Zaehler+1);save();}};

el.editBtn.onclick=()=>{
  el.editArea.classList.toggle("hidden");
  el.editDeutsch.value=current.Deutsch;
  el.editSpanisch.value=current.Spanisch;
  el.editBemerkungen.value=current.Bemerkungen;
};

function autoSave(){
  if(!current) return;
  current.Deutsch=el.editDeutsch.value;
  current.Spanisch=el.editSpanisch.value;
  current.Bemerkungen=el.editBemerkungen.value;
  save();
}

el.editDeutsch.oninput=autoSave;
el.editSpanisch.oninput=autoSave;
el.editBemerkungen.oninput=autoSave;

function save(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(words));
}

function load(){
  let d=localStorage.getItem(STORAGE_KEY);
  if(d) words=JSON.parse(d);
}

el.exportBtn.onclick=()=>{
  let header=["Nummer","Deutsch","Spanisch","Zaehler","Bemerkungen","KategorieID"];

  let rows=words.map(w=>[
    w.Nummer,w.Deutsch,w.Spanisch,w.Zaehler,w.Bemerkungen,w.KategorieID
  ]);

  let csv=[header.join(";")]
  .concat(rows.map(r=>r.map(v=>`"${v||""}"`).join(";")))
  .join("\n");

  let blob=new Blob(["\uFEFF"+csv],{type:"text/csv"});
  let a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="export.csv";
  a.click();
};

el.importFile.onchange=e=>{
  let f=e.target.files[0];
  let reader=new FileReader();
  reader.onload=()=>{
    let text=reader.result.split("\n").slice(1);

    words=text.map((l,i)=>{
      let c=l.split(";");
      return {
        Nummer:i,
        Deutsch:c[1],
        Spanisch:c[2],
        Kategorie:c[3],
        Zaehler:Number(c[4]||1),
        Bemerkungen:c[5],
        KategorieID:Number(c[6]||0)
      };
    });

    save();
  };
  reader.readAsText(f);
};

load();

</script>
</body>
</html>
